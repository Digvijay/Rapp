<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon Base (representing structural safety and data) -->
  <polygon points="80,20 135,50 135,110 80,140 25,110 25,50" 
           fill="none" 
           stroke="url(#grad1)" stroke-width="8" stroke-linejoin="round" />

  <!-- Inner Dynamic Arrows/Blocks (representing high-speed binary serialization) -->
  <!-- Left to Center Arrow -->
  <path d="M45,80 L70,55 L70,70 L105,70 L105,90 L70,90 L70,105 Z" fill="url(#grad2)" filter="url(#glow)"/>
  
  <!-- Right dynamic accents (binary bits streaming) -->
  <rect x="110" y="65" width="12" height="12" rx="2" fill="url(#grad1)" />
  <rect x="110" y="85" width="12" height="12" rx="2" fill="url(#grad2)" />
  <rect x="125" y="75" width="8" height="8" rx="1.5" fill="#3b82f6" />
</svg>
